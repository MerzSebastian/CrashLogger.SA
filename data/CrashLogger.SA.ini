; CrashLogger.SA configuration. Keep this file next to CrashLogger.SA.asi.
; All keys are optional; the values shown are the defaults.

[General]
; Log and dump are written next to gta_sa.exe. Plain file names only (no folders).
LogFile=crashlog.txt
DumpFile=crashlog.dmp

; Write a minidump (.dmp) in addition to the text log.
WriteMinidump=1
; Include the exe's global data (game state) in the minidump. Adds a few MB.
DumpDataSegments=1
; Write a full-memory dump instead. Very large (1-2 GB); only for deep debugging.
FullMemoryDump=0

; GTA SA often throws an exception while closing, after its window is gone. Ignore
; those instead of reporting them as crashes.
IgnoreShutdownCrashes=1

; After a real crash has been reported, end the process immediately. Without this
; Windows' default handling can leave the frozen game window hanging around.
TerminateAfterReport=1

; Show a message box with the log location after a crash.
ShowMessageBox=1

; Also log fatal-looking exceptions as soon as they are raised, even if the game or
; another mod might still handle them. Use this if a crash is swallowed silently
; and no crashlog.txt appears. May produce a log for exceptions that were harmless.
LogFirstChance=0

[Streaming]
; Record recent streaming requests (model IDs) for the log. A background thread
; polls the game's streaming table; set to 0 to disable it completely.
Monitor=1
SampleIntervalMs=25
; How many of the most recent requests to print (1-64).
HistorySize=32

[Symbols]
; Address -> function name data file, searched next to the .asi, then in the game
; folder, then in game\scripts.
File=gta_sa_1.0_us.symbols
; Unsized symbols match up to this many bytes past their start (shown as "~Name+0x..").
MaxGap=1024
